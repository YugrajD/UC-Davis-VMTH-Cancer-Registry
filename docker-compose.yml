services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vmth_cancer_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgis/postgis:16-3.4
    container_name: vmth_cancer_migrate
    environment:
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
    volumes:
      - ./database/migrations:/database/migrations:ro
      - ./database/scripts/run_migrations.sh:/run_migrations.sh:ro
    entrypoint: ["sh", "/run_migrations.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # Seeds the cognito-local named volume with a fixed User Pool + App Client
  # (database/docker/cognito-local/seed/) on first run only, so the pool/
  # client IDs are stable across `docker compose down -v` cycles instead of
  # cognito-local generating new random IDs every time.
  cognito-seed:
    image: busybox:1.36
    container_name: vmth_cancer_cognito_seed
    volumes:
      - ./database/docker/cognito-local/seed:/seed:ro
      - cognito_local_data:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ ! -f /data/local_vmthdev.json ]; then
          cp /seed/*.json /data/
          echo "Seeded cognito-local with fixed pool local_vmthdev"
        else
          echo "cognito-local data already present, skipping seed"
        fi

  cognito-local:
    image: jagregory/cognito-local:latest
    container_name: vmth_cancer_cognito_local
    volumes:
      - cognito_local_data:/app/.cognito/db
    ports:
      - "9229:9229"
    depends_on:
      cognito-seed:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vmth_cancer_backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost:5173"]'}
      ML_WORKER_URL: ${ML_WORKER_URL:-http://ml-worker:8001}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-local_vmthdev}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-vmthcancerregistryweb}
      COGNITO_ISSUER_URL: ${COGNITO_ISSUER_URL:-http://cognito-local:9229}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      UPLOAD_DIR: /app/uploads
      # GCP Batch (optional)
      USE_GCP_BATCH: ${USE_GCP_BATCH:-false}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_REGION: ${GCP_REGION:-us-central1}
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCP_BATCH_IMAGE_URI: ${GCP_BATCH_IMAGE_URI:-}
      GCP_BATCH_SERVICE_ACCOUNT: ${GCP_BATCH_SERVICE_ACCOUNT:-}
      GCP_BATCH_MACHINE_TYPE: ${GCP_BATCH_MACHINE_TYPE:-n1-standard-4}
      GCP_BATCH_POLL_INTERVAL: ${GCP_BATCH_POLL_INTERVAL:-60}
      GCP_BATCH_TIMEOUT_HOURS: ${GCP_BATCH_TIMEOUT_HOURS:-12}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ml:/ml
      - ./secrets:/app/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      cognito-local:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vmth_cancer_frontend
    environment:
      # VITE_API_URL is intentionally empty in dev: the browser must use
      # relative URLs so they go through the Vite dev-server proxy. The
      # proxy itself uses DEV_PROXY_TARGET (read in vite.config.ts) to
      # forward to the backend over the docker network.
      VITE_API_URL: ""
      DEV_PROXY_TARGET: http://backend:8000
      VITE_COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-local_vmthdev}
      VITE_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-vmthcancerregistryweb}
      # Browser-facing endpoint — must be reachable from the host (not the
      # docker network hostname), so cognito-local's published port is used.
      VITE_COGNITO_ENDPOINT: ${VITE_COGNITO_ENDPOINT:-http://localhost:9229}
      VITE_COGNITO_GOOGLE_OAUTH_DOMAIN: ${VITE_COGNITO_GOOGLE_OAUTH_DOMAIN:-}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: sh -c "npm install && npx vite --host 0.0.0.0"

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vmth_cancer_seed
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
    volumes:
      - ./database:/database
      - ./backend:/app
      - ./geo:/geo
      - ./ml:/ml
    command: python /database/seed/seed_mock_data.py
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles:
      - seed

  ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vmth_cancer_ingest
    environment:
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      DATA_DIR: /database/data
      GEO_DATA_DIR: /geo/data
    volumes:
      - ./database:/database
      - ./backend:/app
      - ./geo:/geo
    command: python /database/seed/ingest_petbert.py
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles:
      - ingest

  geo-seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vmth_cancer_geo_seed
    environment:
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      GEO_DATA_DIR: /geo/data
    volumes:
      - ./database:/database
      - ./geo:/geo
    command: python /database/seed/county_boundaries.py
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles:
      - geo-seed

  ml-worker:
    build: ./ml-worker
    container_name: vmth_cancer_ml_worker
    volumes:
      - ./ml-worker:/worker
      - ./ml:/ml
    environment:
      HF_HOME: /ml/.cache/huggingface
      PETBERT_MODEL_PATH: ${PETBERT_MODEL_PATH:-/ml/models/petbert}
      LABELS_CSV_PATH: ${LABELS_CSV_PATH:-/ml/ICD_labels/labels.csv}
      GROUP_CLASSIFIER_PATH: ${GROUP_CLASSIFIER_PATH:-/ml/output/checkpoints/group/group_classifier_best.pt}
      CASE_PRESENCE_CLASSIFIER_PATH: ${CASE_PRESENCE_CLASSIFIER_PATH:-}
      LP_THRESHOLDS_JSON_PATH: ${LP_THRESHOLDS_JSON_PATH:-}
      UNCOMMON_GROUPS_PATH: ${UNCOMMON_GROUPS_PATH:-}
    ports:
      - "8001:8001"
    command: uvicorn app:app --host 0.0.0.0 --port 8001 --reload

volumes:
  frontend_node_modules:
  postgres_data:
  cognito_local_data:
