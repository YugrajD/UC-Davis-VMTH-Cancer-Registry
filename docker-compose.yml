services:
  # Emulates RDS (Postgres) + Cognito behind one AWS API endpoint. See
  # docs/floci-local-dev-migration.md. Needs the docker socket because its
  # RDS emulation spins up a real Postgres container under the hood.
  floci:
    image: floci/floci:latest
    container_name: vmth_cancer_floci
    environment:
      FLOCI_STORAGE_MODE: hybrid
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci_data:/app/data
    ports:
      - "4566:4566"

  # THROWAWAY (see docs/floci-local-dev-migration.md): one-shot aws-cli
  # provisioning of the RDS instance + Cognito pool/client, writing the
  # discovered connection info to the floci_outputs volume for other
  # services to source. Replace with CDK-driven provisioning later.
  floci-init:
    image: amazon/aws-cli:2.17.62
    container_name: vmth_cancer_floci_init
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://floci:4566
    entrypoint: ["sh", "/floci-init.sh"]
    volumes:
      - ./database/docker/floci/floci-init.sh:/floci-init.sh:ro
      - floci_outputs:/shared
    depends_on:
      floci:
        condition: service_started

  # THROWAWAY (see docs/floci-local-dev-migration.md): Floci's RDS emulation
  # runs a plain postgres:18-alpine container (engine-version 18, set in
  # floci-init.sh — see its comment for why) with no PostGIS pre-installed.
  # This apk-installs it into that actual container before migrations run.
  floci-postgis-init:
    image: docker:26-cli
    container_name: vmth_cancer_floci_postgis_init
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./database/docker/floci/install-postgis.sh:/install-postgis.sh:ro
      - floci_outputs:/shared:ro
    entrypoint: ["sh", "/install-postgis.sh"]
    depends_on:
      floci-init:
        condition: service_completed_successfully

  migrate:
    image: postgis/postgis:16-3.4
    container_name: vmth_cancer_migrate
    environment:
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
    volumes:
      - ./database/migrations:/database/migrations:ro
      - ./database/scripts/run_migrations.sh:/run_migrations.sh:ro
      - floci_outputs:/shared:ro
    entrypoint: ["sh", "/run_migrations.sh"]
    depends_on:
      floci-postgis-init:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vmth_cancer_backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost:5173"]'}
      ML_WORKER_URL: ${ML_WORKER_URL:-http://ml-worker:8001}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-local_vmthdev}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-vmthcancerregistryweb}
      COGNITO_ISSUER_URL: ${COGNITO_ISSUER_URL:-http://floci:4566}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      UPLOAD_DIR: /app/uploads
      # GCP Batch (optional)
      USE_GCP_BATCH: ${USE_GCP_BATCH:-false}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_REGION: ${GCP_REGION:-us-central1}
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCP_BATCH_IMAGE_URI: ${GCP_BATCH_IMAGE_URI:-}
      GCP_BATCH_SERVICE_ACCOUNT: ${GCP_BATCH_SERVICE_ACCOUNT:-}
      GCP_BATCH_MACHINE_TYPE: ${GCP_BATCH_MACHINE_TYPE:-n1-standard-4}
      GCP_BATCH_POLL_INTERVAL: ${GCP_BATCH_POLL_INTERVAL:-60}
      GCP_BATCH_TIMEOUT_HOURS: ${GCP_BATCH_TIMEOUT_HOURS:-12}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ml:/ml
      - ./secrets:/app/secrets:ro
      - floci_outputs:/shared:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      floci-init:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vmth_cancer_frontend
    environment:
      # VITE_API_URL is intentionally empty in dev: the browser must use
      # relative URLs so they go through the Vite dev-server proxy. The
      # proxy itself uses DEV_PROXY_TARGET (read in vite.config.ts) to
      # forward to the backend over the docker network.
      VITE_API_URL: ""
      DEV_PROXY_TARGET: http://backend:8000
      VITE_COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-local_vmthdev}
      VITE_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-vmthcancerregistryweb}
      # Relative path, proxied by Vite (see vite.config.ts's '/cognito' rule)
      # to Floci over the docker network — Floci doesn't support CORS on
      # this endpoint, so calling it directly cross-origin from the browser
      # fails; going through Vite's dev server keeps it same-origin instead.
      VITE_COGNITO_ENDPOINT: ${VITE_COGNITO_ENDPOINT:-/cognito}
      DEV_COGNITO_PROXY_TARGET: http://floci:4566
      VITE_COGNITO_GOOGLE_OAUTH_DOMAIN: ${VITE_COGNITO_GOOGLE_OAUTH_DOMAIN:-}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - floci_outputs:/shared:ro
    depends_on:
      floci-init:
        condition: service_completed_successfully
    # THROWAWAY: sources floci-init.sh's discovered VITE_COGNITO_* values
    # (see docs/floci-local-dev-migration.md) before starting vite, since
    # Vite reads import.meta.env from process env at server startup.
    command: sh -c ". /shared/floci-outputs.env 2>/dev/null; npm install && npx vite --host 0.0.0.0"

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vmth_cancer_seed
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
    volumes:
      - ./database:/database
      - ./backend:/app
      - ./geo:/geo
      - ./ml:/ml
      - floci_outputs:/shared:ro
    command: python /database/seed/seed_mock_data.py
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles:
      - seed

  ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vmth_cancer_ingest
    environment:
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      DATA_DIR: /database/data
      GEO_DATA_DIR: /geo/data
    volumes:
      - ./database:/database
      - ./backend:/app
      - ./geo:/geo
      - floci_outputs:/shared:ro
    command: python /database/seed/ingest_petbert.py
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles:
      - ingest

  geo-seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vmth_cancer_geo_seed
    environment:
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      GEO_DATA_DIR: /geo/data
    volumes:
      - ./database:/database
      - ./geo:/geo
      - floci_outputs:/shared:ro
    command: python /database/seed/county_boundaries.py
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles:
      - geo-seed

  ml-worker:
    build: ./ml-worker
    container_name: vmth_cancer_ml_worker
    volumes:
      - ./ml-worker:/worker
      - ./ml:/ml
    environment:
      HF_HOME: /ml/.cache/huggingface
      PETBERT_MODEL_PATH: ${PETBERT_MODEL_PATH:-/ml/models/petbert}
      LABELS_CSV_PATH: ${LABELS_CSV_PATH:-/ml/ICD_labels/labels.csv}
      GROUP_CLASSIFIER_PATH: ${GROUP_CLASSIFIER_PATH:-/ml/output/checkpoints/group/group_classifier_best.pt}
      CASE_PRESENCE_CLASSIFIER_PATH: ${CASE_PRESENCE_CLASSIFIER_PATH:-}
      LP_THRESHOLDS_JSON_PATH: ${LP_THRESHOLDS_JSON_PATH:-}
      UNCOMMON_GROUPS_PATH: ${UNCOMMON_GROUPS_PATH:-}
    ports:
      - "8001:8001"
    command: uvicorn app:app --host 0.0.0.0 --port 8001 --reload

volumes:
  frontend_node_modules:
  floci_data:
  floci_outputs:
